<!DOCTYPE html>
<html lang="en">
    
  <head>
      
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>My concerts</title>
    <link rel="stylesheet" href="css/mdb.min.css" />
    
  </head>
  
  <body class="bg-dark">
    <nav class="navbar content-expand-lg fixed-top">
        <div class="container-fluid">
            <a href="#home" class="nav-link text-white col-md-1">Home</a>
            <a href="#section" class="nav-link text-white col-md-11">Been to</a>  
        </div>
    </nav>
        
    <header id="home"
        class="p-5 text-center bg-image"
        style="background-image: url('./img/banner.jpeg'); height: 400px"
    >
        <div class="mask">
            <div class="h-100">
                <div class="text-white container-fluid row mt-5">
                    <h1 class="col align-self-start col-md-4">Concerts</h1>
                </div>
                <div class="text-white container-fluid row mt-5">
                    <h3 class="col-md-4">I have gone to</h3>
                </div>
            </div>
        </div>
    </header>

    <div class="container-fluid row justify-content-evenly mt-5" id="section">
        <div class="card col-md-4 bg-primary pt-2">
            <img src="./img/offspring.jpeg" alt="offspring" class="card-img-top">
            <div class="card-body text-white">
                <h5>Offspring + Simple plan</h5>
            </div>
        </div>
        <div class="card col-md-4 bg-danger pt-2">
            <img src="./img/SOAD.jpeg" alt="System of a down" class="card-img-top">
            <div class="card-body text-white">
                <h5>System of a down + Queens of the stone age + Acid bath</h5>
            </div>
        </div>
    </div>

    <footer class="text-white text-center mt-5">
        <div class="container text-start">
            <section>
                <div class="accordion">
                  <div class="accordion-item bg-dark">
                    <h2 class="accordion-header">
                      <button
                        data-mdb-collapse-init
                        class="accordion-button bg-dark text-white"
                        type="button"
                        data-mdb-target="#collapseOne"
                        aria-expanded="false"
                        aria-controls="collapseOne"
                      >
                        Contacts
                      </button>
                    </h2>
                    <div id="collapseOne"
                        class="accordion-collapse collapse"
                        aria-labelledby="headingOne"
                    >
                      <div class="accordion-body row">
                          <ul class="align-self-start col-md-4 text-white">
                              <li>Gmail: ipb24.p.puzulis@vtdt.edu.lv</li>
                              <li>Phone: +371 24 335 445</li>
                          </ul>
                      </div>
                    </div>
                  </div>
            </section>
        </div>
        <div class="text-center p-3">
            © 2026 Copyright:
            <a class="text-white" href="https://patriks-developer.vercel.app/">Patriks</a>
        </div>
    </footer>
    <script type="text/javascript" src="js/mdb.umd.min.js"></script>
    <script type="text/javascript">
      
    </script>
  </body>
</html>
